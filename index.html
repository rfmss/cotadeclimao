<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COTA DE CLIMÃO - DASHBOARD UNIVERSAL</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  
  <!-- Microsoft Fluent System Icons via Iconify -->
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</head>
<body>
<div id="app-main" role="main" data-state="loading">
  
  <div class="dashboard-grid">
    
    <!-- ÁREA 1: O "SEMÁFORO" GERAL E AÇÃO -->
    <section class="panel panel-status" aria-label="Status Geral e Ação Recomendada">
      <header class="sys-header">
        <h1 class="logo">COTA DE CLIMÃO</h1>
        <div class="badge" role="status">
          <span class="status-indicator" style="display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px;"></span>
          <span id="status-label">ATUALIZANDO...</span>
        </div>
        <div id="updated-at" class="badge-time"></div>
      </header>

      <!-- Cartão de Gravidade Máxima -->
      <div class="traffic-light-card" id="traffic-card" aria-live="polite" aria-atomic="true">
        <div class="score-title"><span class="iconify" data-icon="fluent:heart-pulse-24-filled" style="vertical-align: -0.15em; font-size: 1.2em; margin-right: 4px;"></span> ÍNDICE DE RISCO CLIMÁTICO (0 a 100)</div>
        <div class="score-number-display" id="fake-score" aria-label="Pontuação de risco">00</div>
        <h2 id="score-label" class="score-word">MEDINDO...</h2>
        <div id="quick-tips" class="quick-tips"></div>
        <div id="stamp-row" class="stamps"></div>
        
        <!-- Elementos ocultos exigidos pela engrenagem do app.js -->
        <div style="display:none;" aria-hidden="true">
          <div id="d1"><div class="static-top"><span></span></div><div class="static-bottom"><span></span></div><div class="flap-front"><span></span></div><div class="flap-back"><span></span></div></div>
          <div id="d2"><div class="static-top"><span></span></div><div class="static-bottom"><span></span></div><div class="flap-front"><span></span></div><div class="flap-back"><span></span></div></div>
        </div>
      </div>

      <!-- O QUE FAZER -->
      <div class="action-board">
        <div class="personas" role="group" aria-label="Perfil de recomendação">
          <button data-persona="geral" class="btn-action active" aria-pressed="true"><span class="iconify" data-icon="fluent:home-24-filled" aria-hidden="true"></span> GERAL</button>
          <button data-persona="pescador" class="btn-action" aria-pressed="false"><span class="iconify" data-icon="fluent:vehicle-ship-24-filled" aria-hidden="true"></span> PESCA</button>
          <button data-persona="agricultor" class="btn-action" aria-pressed="false"><span class="iconify" data-icon="fluent:leaf-two-24-filled" aria-hidden="true"></span> ROÇA</button>
        </div>
        <ul id="rec-list" class="huge-instructions" aria-label="Lista de recomendações operacionais" tabindex="0"></ul>
      </div>

      <!-- Avisos Extras Embutidos -->
      <div class="extra-alerts">
        <div id="conn-banner" role="status" aria-live="polite" hidden></div>
        <div id="err-box" role="alert" aria-live="assertive" hidden></div>
        <div id="stress-box" role="status" aria-live="polite" hidden></div>
        <div id="mar-info" role="status" aria-live="polite" hidden></div>
        <section id="indicadores" hidden><ul id="indicadores-list"></ul></section>
        <section id="el-nino" hidden>⚠️ EL NIÑO: <span class="en-valor"></span></section>
      </div>

      <!-- Legenda de Cores -->
      <div class="color-legend" aria-hidden="true">
        <span style="--color: var(--c-bom);">Seguro</span>
        <span style="--color: var(--c-atencao);">Atenção</span>
        <span style="--color: var(--c-alerta);">Alerta</span>
        <span style="--color: var(--c-perigo);">Perigo</span>
        <span style="--color: var(--c-emergencia);">Extremo</span>
      </div>
    </section>

    <!-- ÁREA 2: AS 6 COTAS -->
    <section class="panel panel-factors" aria-label="Cotas Meteorológicas">
      <h2 class="visually-hidden">Cotas dos Fatores Climáticos</h2>
      <div id="factor-list" class="factors-grid"></div>
    </section>

  </div>

  <div class="loading-ring" role="status" aria-label="Carregando dados meteorológicos"><div class="ring" aria-hidden="true"></div></div>
</div>

<script src="js/schema.js"></script>
<script src="js/calculations.js"></script>
<script src="js/factors.js"></script>
<script src="js/risk.js"></script>
<script src="js/storage.js"></script>
<script src="js/recommendations.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  // O app.js já renderizou e escondeu o loading.
  // Vamos garantir que as cores sejam aplicadas mesmo em navegadores antigos (que não suportam :has no CSS)
  document.addEventListener('DOMContentLoaded', () => {
    
    // 1. Observador para o Cartão Principal (Esquerda)
    const d1 = document.querySelector('#d1 .static-top span');
    const d2 = document.querySelector('#d2 .static-top span');
    const fake = document.getElementById('fake-score');
    const card = document.getElementById('traffic-card');

    if(d1 && d2 && fake && card) {
      const tips = document.getElementById('quick-tips');
      const obsCard = new MutationObserver(() => {
        const scoreText = (d1.textContent + d2.textContent).trim();
        fake.textContent = scoreText;
        const val = parseInt(scoreText, 10);
        card.className = 'traffic-light-card';
        const scoreWord = document.getElementById('score-label')?.textContent?.toUpperCase() || '';
        const isIndisponivel = isNaN(val) || scoreText === '--' || scoreText.includes('-') || scoreWord.includes('INDISPON') || scoreWord.includes('INSUFIC');
        if(isIndisponivel) {
          card.classList.add('bg-indisponivel');
          if(tips) tips.innerHTML = '⚠️ <strong>DADOS INDISPONÍVEIS:</strong> Aguardando sincronização de rede para calcular os índices de risco.';
        }
        else if(val >= 80) {
          card.classList.add('bg-emergencia');
          if(tips) tips.innerHTML = '🚨 <strong>PERIGO EXTREMO:</strong> Risco à vida. Idosos e crianças devem ficar em ambiente climatizado. Não saia de casa sem extrema necessidade.';
        }
        else if(val >= 60) {
          card.classList.add('bg-perigo');
          if(tips) tips.innerHTML = '⚠️ <strong>ALERTA GRAVE:</strong> Risco alto de insolação ou danos. Cancele atividades ao ar livre. Monitore a hidratação de idosos e crianças de perto.';
        }
        else if(val >= 40) {
          card.classList.add('bg-alerta');
          if(tips) tips.innerHTML = '☀️ <strong>ATENÇÃO:</strong> Exige cautela. Use óculos, passe bastante protetor solar, vista roupas leves e beba muita água ao longo do dia.';
        }
        else if(val >= 20) {
          card.classList.add('bg-atencao');
          if(tips) tips.innerHTML = '👀 <strong>CUIDADO LEVE:</strong> Evite exposição prolongada no meio-dia. Mantenha uma garrafa de água por perto.';
        }
        else {
          card.classList.add('bg-bom');
          if(tips) tips.innerHTML = '✅ <strong>CLIMA SEGURO:</strong> Condições amigáveis. Aproveite o dia ao ar livre com tranquilidade.';
        }
      });
      obsCard.observe(d1, {childList: true, characterData: true, subtree: true});
      obsCard.observe(d2, {childList: true, characterData: true, subtree: true});
    }

    // 2. Observador para os 6 Fatores (Direita) - Corrige o bug de fundo branco!
    const factorList = document.getElementById('factor-list');
    if(factorList) {
      const obsFactors = new MutationObserver(() => {
        const fatores = factorList.querySelectorAll('.factor');
        fatores.forEach(f => {
          // Descobre a classe 'level-X' que o app.js injetou no filho
          const gauge = f.querySelector('.factor-gauge');
          if(gauge) {
            const match = gauge.className.match(/level-\w+/);
            if(match) {
              f.classList.add(match[0]); // Aplica a classe 'level-X' direto no elemento PAI (.factor)
            }
          }
        });
      });
      obsFactors.observe(factorList, {childList: true, subtree: true});
    }

  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
